# Publish n8n-nodes-postdom to npm with provenance.
#
# n8n verified community nodes must be published from a GitHub Action with a
# provenance statement (mandatory since May 2026), so anyone can
# cryptographically verify which workflow, repository, and commit built the
# package.
#
# The first release uses a granular npm token stored as the NPM_TOKEN secret.
# Once the package exists on npm, this exact public repository and workflow can
# be configured as its OIDC trusted publisher and the token removed.

name: Publish n8n-nodes-postdom (provenance)

on:
  workflow_dispatch: {}
  push:
    tags:
      - "n8n-nodes-postdom@*"

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
